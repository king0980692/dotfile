"$schema" = "https://starship.rs/config-schema.json"
scan_timeout = 100
command_timeout = 500
follow_symlinks = false
add_newline = false
palette = "custom1"

# One bubble per component, each with its own tinted dark background (see
# [palettes.custom1]). Every segment paints its own bg, so the prompt reads the
# same on a light or a dark terminal instead of relying on the terminal's own
# background — the bare mocha accents wash out on white (teal was 1.5:1).
format = """
$directory\
${custom.giturl}\
${custom.git_worktree}\
$git_branch\
$git_status\
$character\
"""
# right_format disabled: ble.sh can't render starship's right prompt cleanly
# (it redraws it across multiple lines). Keep the prompt single-line.
right_format = ""

[directory]
style = "fg:teal bg:dir_bg"
format = "[](fg:dir_bg)[ $path ]($style)[](fg:dir_bg) "
truncation_length = 4

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Developer" = "󰲋 "
"Others" = " "

[username]
disabled = true
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = " $user "

[line_break]
disabled = true

[character]
disabled = false
# default is "$symbol " — the trailing space sits outside the style and would
# punch a hole in the bubble right before the closing cap.
format = "[](fg:char_bg)$symbol[](fg:char_bg) "
success_symbol = "[  ](bold fg:green bg:char_bg)"
error_symbol = "[ ✘ ](bold fg:red bg:char_bg)"
vimcmd_symbol = "[ : ](bold fg:yellow bg:char_bg)"

[package]
disabled = false

[time]
disabled = true
time_format = "%R"
format = "[[  $time ](fg:yellow bg:foam)]($style)"

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
style = "fg:subtext0 bg:git_bg"
format = "[](fg:git_bg)[ $output ]($style)"
require_repo = true
ignore_timeout = true

[git_branch]
symbol = " "
style = "fg:lavender bg:git_bg"
format = "[$symbol$branch ]($style)[](fg:git_bg) "

# [git_status]
# MINIMAL git status
# format = " [($all_status$ahead_behind )]($style)"
# ahead    = "⇡${count} "
# behind   = "⇣${count} "
# diverged = "⇕⇡${ahead_count}⇣${behind_count} "

[git_status]
style = "bg:status_bg"
format = "([](fg:status_bg)[ $untracked$staged$modified$renamed$conflicted$ahead_behind]($style)[](fg:status_bg) )"
# options available for format
staged     = "[+ ](green bg:status_bg)"
modified   = "[! ](yellow bg:status_bg)"
renamed    = "[» ](blue bg:status_bg)"
deleted    = "[- ](red bg:status_bg)"
untracked  = "[? ](red bg:status_bg)"
stashed    = "[≡ ](lavender bg:status_bg)"
conflicted = "[✖ ](red bold bg:status_bg)"

ahead      = "[⇡${count} ](teal bg:status_bg)"
behind     = "[⇣${count} ](peach bg:status_bg)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count} ](mauve bg:status_bg)"

[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
      common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
      git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
      if [ "$common_dir" != "$git_dir" ]; then
            echo "⛓ "
      fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "([ $output]($style))"
style = "bold fg:green bg:git_bg"
require_repo = true
ignore_timeout = true


[os]
disabled = true

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = " "
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[nodejs]
symbol = ""
format = "[ $symbol( $version) ]($style)"

[bun]
detect_files = ["bun.lock", "bun.lockb"]

[c]
symbol = " "
format = "[ $symbol( $version) ]($style)"

[rust]
symbol = ""
format = "[ $symbol( $version) ]($style)"

[golang]
symbol = ""
format = "[ $symbol( $version) ]($style)"
detect_files = ["go.mod"]

[php]
symbol = ""
format = "[ $symbol( $version) ]($style)"

[java]
symbol = " "
format = "[ $symbol( $version) ]($style)"

[kotlin]
symbol = ""
format = "[ $symbol( $version) ]($style)"

[haskell]
symbol = ""
format = "[ $symbol( $version) ]($style)"

[python]
symbol = ""
format = "[ $symbol( $version) ]($style)"

[docker_context]
symbol = ""
format = "[ $symbol( $context) ]($style)"

[palettes.custom1]
# --- per-bubble backgrounds: each accent mixed ~22-32% over crust, so every
# bubble keeps its own hue while staying dark enough for light text on any
# terminal background. Ratios below are the fg on that bubble (AA needs 4.5).
# status stays neutral because it holds red/yellow/green/blue glyphs at once.
dir_bg = "#3b5457"     # teal      -> fg teal      5.44:1
git_bg = "#454864"     # lavender  -> fg lavender  4.96:1
status_bg = "#313244"  # neutral   -> worst glyph  5.43:1
char_bg = "#323f38"    # green @22% -> green 7.42:1, red 4.76:1, yellow 8.68:1
                       # (lighter tints drop the error glyph below AA on this bg)

