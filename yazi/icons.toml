# Material Design (nf-md) icon set for yazi, shared by the dark and light themes.
# fg values are palette roles (@blue, @gray, ...); leon_scripts/yazi-theme-gen.sh
# swaps them for each flavor's colours from [roles.<flavor>] below.
# Anything not listed falls through to conds: a plain folder or file outline.

[roles.kanagawa]  # Wave
fg = "#dcd7ba"
gray = "#727169"
blue = "#7e9cd8"
cyan = "#7fb4ca"
green = "#98bb6c"
yellow = "#e6c384"
orange = "#ffa066"
red = "#e46876"
pink = "#d27e99"
violet = "#957fb8"

[roles.kanagawa-lotus]
fg = "#545464"
gray = "#8a8980"
blue = "#4d699b"
cyan = "#5a7785"
green = "#6f894e"
yellow = "#77713f"
orange = "#cc6d00"
red = "#c84053"
pink = "#b35b79"
violet = "#624c83"

[icon]
globs = []
dirs = [
