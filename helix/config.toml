# Migrated from nvim/init.lua; keep Helix's selection-first d/c/y model.
theme = "ayu_dark"

[editor]
line-number = "absolute"
cursorline = true
scrolloff = 15
bufferline = "multiple"
color-modes = true
default-yank-register = "+"
auto-format = true
end-of-line-diagnostics = "hint"

[editor.auto-save.after-delay]
enable = true
timeout = 3000

[editor.soft-wrap]
enable = false

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal]
esc = ["normal_mode", "keep_primary_selection", "collapse_selection"]
C-v = ["select_mode", "copy_selection_on_next_line"]
C-s = [":write", "normal_mode"]
C-d = ["page_cursor_half_down", "align_view_center"]
C-u = ["page_cursor_half_up", "align_view_center"]
H = "goto_previous_buffer"
L = "goto_next_buffer"
C-tab = "goto_next_buffer"
C-S-tab = "goto_previous_buffer"
C-t = "file_picker"
# Helix searches the workspace, not just the current file's directory.
C-f = "global_search"
C-b = "file_explorer_in_current_buffer_directory"
"-" = "file_explorer_in_current_buffer_directory"
"C-]" = "goto_definition"
A-h = "jump_view_left"
A-j = "jump_view_down"
A-k = "jump_view_up"
A-l = "jump_view_right"
A-w = { n = "goto_previous_buffer", m = "goto_previous_buffer", "." = "goto_next_buffer", "/" = "goto_next_buffer", x = ":buffer-close" }
"0" = "goto_line_start"
"^" = "goto_first_nonwhitespace"
"$" = "goto_line_end"
G = "goto_last_line"
V = ["select_mode", "extend_to_line_bounds"]
D = ["extend_to_line_end", "delete_selection"]
C = ["extend_to_line_end", "change_selection"]
Y = ["extend_to_line_bounds", "yank"]
q = "no_op"
F5 = "dap_continue"

[keys.normal.space]
o = ":config-reload"
y = "yank_to_clipboard"
d = ["yank_to_clipboard", "delete_selection_noyank"]
p = "paste_clipboard_after"
D = "workspace_diagnostics_picker"
e = "file_explorer"
E = "file_explorer"
b = "dap_toggle_breakpoint"
B = "buffer_picker"
g = "global_search"
J = "jumplist_picker"

# Helix 25.07 may replace text with stderr on failure; suppress it so errors abort.
[keys.normal.space.j]
q = ["select_all", ":pipe jq . 2>/dev/null"]
c = ["select_all", ":pipe jq -c . 2>/dev/null"]

[keys.normal.space.t]
d = ":theme ayu_dark"
l = ":theme ayu_light"
m = ":theme ayu_mirage"

[keys.normal.space.l]
d = "diagnostics_picker"
f = ":format"

[keys.normal.s]
a = "surround_add"
d = "surround_delete"
r = "surround_replace"

[keys.insert]
esc = ["normal_mode", "keep_primary_selection", "collapse_selection"]
C-s = ["normal_mode", ":write"]
# A single j is buffered until the next key; jj exits, other text is replayed.
j = { j = "normal_mode" }
C-b = "@breakpoint()<esc>"
C-space = "completion"
A-h = ["normal_mode", "jump_view_left"]
A-j = ["normal_mode", "jump_view_down"]
A-k = ["normal_mode", "jump_view_up"]
A-l = ["normal_mode", "jump_view_right"]

[keys.select]
esc = ["normal_mode", "keep_primary_selection", "collapse_selection"]
C-v = "copy_selection_on_next_line"
C-s = [":write", "normal_mode"]
p = "replace_with_yanked"
C-d = ["page_cursor_half_down", "align_view_center"]
C-u = ["page_cursor_half_up", "align_view_center"]
"0" = "goto_line_start"
"^" = "goto_first_nonwhitespace"
"$" = "goto_line_end"
G = "extend_to_last_line"
A-h = "jump_view_left"
A-j = "jump_view_down"
A-k = "jump_view_up"
A-l = "jump_view_right"

[keys.select.space]
y = "yank_to_clipboard"
d = ["yank_to_clipboard", "delete_selection_noyank", "normal_mode"]

[keys.select.s]
a = "surround_add"
d = "surround_delete"
r = "surround_replace"
