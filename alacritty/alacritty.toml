# Ported from ~/.config/ghostty/config
# NOTE: Alacritty auto-reloads this file on save (no reload keybind needed).

# ── Theme ───────────────────────────────────────────────
# theme.toml is generated by leon_scripts/toggle_theme.sh (a copy of
# themes/dark.toml or themes/light.toml) so Alacritty follows the macOS
# appearance. Alacritty live-reloads imports, so the swap is instant.
[general]
import = ["~/.config/alacritty/theme.toml"]

# ── Font ────────────────────────────────────────────────
[font]
size = 17.0

# Cascadia Mono NF ships real bold/italic faces, so Alacritty uses them
# directly — no synthetic styling (matches ghostty font-synthetic-style = false).
[font.normal]
family = "Cascadia Mono NF"

# ── Window ──────────────────────────────────────────────
[window]
# ghostty window-width/height are in cells
dimensions = { columns = 180, lines = 50 }
padding = { x = 0, y = 0 }
# ghostty macos-option-as-alt = true
option_as_alt = "Both"

# ── Cursor ──────────────────────────────────────────────
[cursor]
style = { shape = "Block", blinking = "Off" }

# ── Selection ───────────────────────────────────────────
# ghostty copy-on-select = clipboard
[selection]
save_to_clipboard = true

# ── Keybindings ─────────────────────────────────────────
# ghostty `super` = macOS Command; chars values below start with ESC (0x1b).
#
# Not portable to Alacritty (no equivalent), so omitted:
#   global:alt+space  toggle_quick_terminal   (quick terminal / global hotkey)
#   super+r           reload_config           (Alacritty live-reloads automatically)

[keyboard]
bindings = [
  # UI
  { key = "F11", action = "ToggleFullscreen" },
  { key = "=", mods = "Alt", action = "IncreaseFontSize" },
  { key = "-", mods = "Alt", action = "DecreaseFontSize" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  # Native macOS tabs
  { key = "Tab", mods = "Control",       action = "SelectNextTab" },
  { key = "Tab", mods = "Control|Shift", action = "SelectPreviousTab" },
  { key = "T",   mods = "Control|Shift", action = "CreateNewTab" },

  # ── tmux M-… (Meta/Alt) via Command → send ESC-prefixed sequences ──
  # Prefix / popup
  { key = "Q", mods = "Command", chars = "\u001bq" },
  { key = "P", mods = "Command", chars = "\u001bp" },

  # Pane navigation (M-h/j/k/l/c/i/w//)
  { key = "H", mods = "Command", chars = "\u001bh" },
  { key = "J", mods = "Command", chars = "\u001bj" },
  { key = "K", mods = "Command", chars = "\u001bk" },
  { key = "L", mods = "Command", chars = "\u001bl" },
  { key = "C", mods = "Command", chars = "\u001bc" },
  { key = "I", mods = "Command", chars = "\u001bi" },
  { key = "W", mods = "Command", chars = "\u001bw" },
  { key = "/", mods = "Command", chars = "\u001b/" },

  # Pane resize (M-Left/Right/Up/Down)
  { key = "Left",  mods = "Command", chars = "\u001b[1;3D" },
  { key = "Right", mods = "Command", chars = "\u001b[1;3C" },
  { key = "Up",    mods = "Command", chars = "\u001b[1;3A" },
  { key = "Down",  mods = "Command", chars = "\u001b[1;3B" },

  # Window split
  { key = "N", mods = "Command", chars = "\u001bn" },
  { key = "'", mods = "Command", chars = "\u001b'" },
  { key = "5", mods = "Command", chars = "\u001b5" },

  # Session switcher
  { key = "S", mods = "Command", chars = "\u001bs" },
]
