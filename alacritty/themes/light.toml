# Rose Pine Dawn — mirrors the `light:` half of ghostty's `theme` setting.
# Source: Ghostty.app/Contents/Resources/ghostty/themes/Rose Pine Dawn

[colors.primary]
background = "#faf4ed"
foreground = "#575279"

[colors.cursor]
text   = "#faf4ed"
cursor = "#575279"

[colors.selection]
text       = "#575279"
background = "#dfdad9"

[colors.normal]
black   = "#f2e9e1"
red     = "#b4637a"
green   = "#286983"
yellow  = "#ea9d34"
blue    = "#56949f"
magenta = "#907aa9"
cyan    = "#d7827e"
white   = "#575279"

[colors.bright]
black   = "#9893a5"
red     = "#b4637a"
green   = "#286983"
yellow  = "#ea9d34"
blue    = "#56949f"
magenta = "#907aa9"
cyan    = "#d7827e"
white   = "#575279"
