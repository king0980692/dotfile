# Shared Codex settings, managed in ~/.config/agents/codex/config.base.toml.
# agents/sync.sh writes ~/.codex/config.toml = this file + that machine's own
# sections (trusted projects, hook trust hashes, MCP servers with local paths,
# UI nudges), which Codex keeps adding to and which stay out of git.

model = "gpt-6.1-terra"
model_reasoning_effort = "medium"
[tui]
status_line = ["model-with-reasoning", "current-dir", "five-hour-limit", "weekly-limit", "context-window-size"]
screen_reader_detection_done = true
theme = "zenburn"

[notice]
hide_rate_limit_model_nudge = true

[features]
hooks = true

[marketplaces.diagram-design]
source_type = "git"
source = "https://github.com/cathrynlavery/diagram-design.git"

[plugins."diagram-design@diagram-design"]
enabled = true
