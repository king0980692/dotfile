[package]
name = "herdr-goto"
version = "0.1.0"
edition = "2021"
description = "Tree navigator for herdr workspaces/tabs/panes (clone of the built-in Go-to widget)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
unicode-width = "0.2"
fuzzy-matcher = "0.3"

[profile.release]
opt-level = 2
strip = true
