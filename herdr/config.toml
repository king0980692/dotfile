onboarding = false

# [theme]
# Fallback when the host terminal does not answer the OSC 11 background query.
# name = "terminal"
# Follow the attached terminal's light/dark appearance (herdr probes it with
# OSC 11, so over SSH this reflects the laptop I'm sitting at, not this box).
# auto_switch = false
# dark_name  = "dracula"
# light_name = "catppuccin-latte"

# Don't paint a panel background: leave those cells at the terminal's own
# default so whatever Ghostty draws behind them (custom shader, transparency,
# background image) stays visible. herdr is just a program on the surface; an
# opaque background of its own is what hides the shader.
[theme.custom]
panel_bg = "reset"

# NOTE: herdr 0.7.5 changed [theme.custom] (CustomThemeColors) to palette-name
# overrides (mauve/green/yellow/red/peach/surface_dim/...) — the old
# selection_background/selection_foreground keys are gone and threw "unknown
# config key". Selection color is now derived from the theme palette. Removed to
# clear the error; revisit if herdr re-adds a selection override.

# ---------------------------------------------------------------------------
# Keybindings mapped from ~/.config/tmux/tmux.conf (prefix = M-q, vi mode)
# Each action lists the tmux-prefix form first, then the no-prefix M- chord
# you already use daily. Reload after edits: herdr server reload-config
# ---------------------------------------------------------------------------
[keys]
# tmux: unbind C-b ; set -g prefix M-q
prefix = "alt+q"

# Pane focus. prefix+h/j/k/l = instant built-in focus (stays zoomed). The
# no-prefix M-h/j/k/l are rebound below to unzoom-then-focus (see [[keys.command]]).
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# Splits.  herdr split_vertical = split RIGHT (side-by-side, tmux `%` / M-5)
#          herdr split_horizontal = split DOWN  (stacked,       tmux `"` / M-')
split_vertical   = ["prefix+percent", "alt+5", "prefix+v"]
split_horizontal = ["prefix+shift+quote", "alt+quote", "prefix+minus"]

# Zoom / kill  (tmux prefix z / prefix x)
zoom       = "prefix+z"
close_pane = "prefix+x"

# Swap current pane with a neighbour — reorder panes (tmux prefix { / }).
# herdr swap is directional (no true rotate); left/right ≈ prev/next.
swap_pane_left  = "prefix+{"
swap_pane_right = "prefix+}"

# Copy mode  (tmux prefix [ , vi mode)
copy_mode = "prefix+["

# Tabs == tmux windows  (prefix c new, n/p cycle, , rename)
new_tab       = "prefix+c"
next_tab      = "prefix+n"
previous_tab  = "prefix+p"
rename_tab    = "prefix+comma"

# Detach = plain detach (tmux prefix d). Gave up on session switching via keys
# (herdr can't do it from inside a pane). M-s is now the WORKSPACE manager
# (list / fuzzy / new / rename / delete / switch — all live via the API).
detach = "prefix+d"

# Pickers: tmux prefix s = session tree -> workspace picker (+ M-s habit)
#          tmux prefix w = window tree  -> goto picker
# Built-in workspace-only list picker (no search box) — kept as a fallback.
# prefix+s now runs the fzf live workspace switcher below (see [[keys.command]]).
workspace_picker = "prefix+w"

# Navigator: M-s opens herdr-goto (herdr/goto/, our Rust clone of the built-in
# `goto` tree navigator) as a popup — see the alt+s [[keys.command]] below.
# To go back to the built-in widget: set goto = "alt+s" and drop that block.
goto = ""

# Iterate agents — Ctrl+Tab / Ctrl+Shift+Tab (focus next/prev agent pane)
# next_agent     = "ctrl+tab"
# previous_agent = "ctrl+shift+tab"

# Cycle workspaces — M-[ previous / M-] next
previous_workspace = "alt+["
next_workspace     = "alt+]"

# Jump straight to workspace N (like prefix+N for tabs)
switch_workspace = "prefix+shift+1..9"

# Bonus: prefix-free direct j/k workspace move, no overlay needed
navigate_workspace_down = "alt+shift+j"
navigate_workspace_up   = "alt+shift+k"

# Reload config  (tmux prefix R)
reload_config = "prefix+shift+r"

# Open settings — Alt+,
settings = "alt+comma"

toggle_sidebar = "prefix+b"


# ---------------------------------------------------------------------------
# Live workspace (session) switcher — fzf overlay, analog of your tmux
# tmux_session_switcher.sh popup. type = "pane" runs it in a temporary pane
# that closes when the script exits (like display-popup -E). Type to fuzzy
# filter workspaces, Enter switches, Esc cancels.
# NOTE: [[keys.command]] blocks MUST come after all scalar keys in [keys].
# WORKSPACE switcher/manager: fuzzy-search, Enter switches and closes the
# popup, M-n new, M-r rename, M-x delete — no detach, works fully inside herdr.
# Moving the cursor does NOT switch: the previous WS_LIVE mode previewed via
# fzf's `focus` event, which also fires while filtering, so typing switched.
#   M-s      -> (was the floating popup; now herdr's built-in goto navigator)
#   prefix+s -> same switcher in a temporary split pane (fallback / non-popup).
# ---------------------------------------------------------------------------

# [[keys.command]]
# key = "alt+s"
# type = "popup"
# command = "bash -c 'exec bash \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/workspace_switcher.sh\"'"
# width = "70%"
# height = "70%"

# [[keys.command]]
# key = "prefix+s"
# type = "pane"
# command = "sh -c 'exec \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/workspace_switcher.sh\"'"

# tmux M-n equivalent: add a pane and keep the tab main-vertical (main 55% left,
# rest evenly stacked right). Non-destructive (split + set_split_ratio only).
[[keys.command]]
key = "alt+n"
type = "shell"
command = "\"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/main_vertical.py\""

# # herdr-file-viewer plugin: git-aware file viewer
# [[keys.command]]              # open in a split beside your work
# key = "prefix+f"
# type = "shell"
# command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
#
# [[keys.command]]              # …or in its own tab
# key = "prefix+shift+f"
# type = "shell"
# command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"



# M-s: herdr-goto tree navigator (machine > workspace > pane, live status,
# / search, a/b/w/i/d filter, folding, ' last workspace, p preview, worktrees).
# Source: https://github.com/king0980692/herdr-goto — installed by mise from the
# GitHub release ("github:king0980692/herdr-goto" in mise/config.toml), so it
# lands on the mise shim PATH; $HOME/.local/bin is checked as a fallback for
# hand-copied builds. NOTE: keybinding commands run on whichever machine's
# server the TUI is showing, so the binary (and this config) must exist THERE.
# Falls back to the fzf workspace switcher when herdr-goto is missing.
[[keys.command]]
key = "alt+s"
type = "popup"
description = "Go to"
command = "bash -c 'for g in \"$(command -v herdr-goto)\" \"$HOME/.local/share/mise/shims/herdr-goto\" \"$HOME/.local/bin/herdr-goto\"; do [ -x \"$g\" ] && exec \"$g\"; done; exec bash \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/workspace_switcher.sh\"'"
width = "80%"
height = "80%"

# Previous M-s: fzf workspace switcher popup.
# [[keys.command]]
# key = "alt+s"
# type = "popup"
# command = "bash -c 'exec bash \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/workspace_switcher.sh\"'"
# width = "70%"
# height = "70%"

# Scratch shell — Alt+p. A floating popup running bash; `exit` closes it.
# Uses the native type = "popup" (the same one alt+s uses); older stable
# builds lacked it, which is why this used to be a plain split pane.
[[keys.command]]
key = "alt+p"
type = "popup"
command = "bash"
width = "80%"
height = "60%"

# herdr-sidebar plugin — Alt+b toggles the file/git sidebar
# (strict_toggle on in the sidebar's settings: opens it, or closes it wherever
# focus is). /bin/sh lacks mise's PATH, so call herdr via $HERDR_BIN_PATH.
[[keys.command]]
key = "alt+b"
type = "shell"
command = "\"$HERDR_BIN_PATH\" plugin action invoke herdr-sidebar.open-sidebar"

# Pane resize — M-arrow (tmux: bind -n M-Left/Right/Up/Down resize-pane -L/R/U/D).
# herdr has no scalar per-direction resize key (only resize_mode), so drive the
# `pane resize` API directly. --amount is a fraction of the pane size (~0.03 ≈ a
# few columns/rows per press); bump it if you want bigger steps.
[[keys.command]]
key = "alt+left"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --direction left --amount 0.03 --current"

[[keys.command]]
key = "alt+right"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --direction right --amount 0.03 --current"

[[keys.command]]
key = "alt+up"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --direction up --amount 0.03 --current"

[[keys.command]]
key = "alt+down"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane resize --direction down --amount 0.03 --current"

# M-h/j/k/l pane navigation that UNZOOMS first (built-in focus stays zoomed).
# The wrapper runs `pane zoom --off` then `pane focus --direction ...`.
[[keys.command]]
key = "alt+h"
type = "shell"
command = "bash \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/unzoom-focus.sh\" left"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "bash \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/unzoom-focus.sh\" down"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "bash \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/unzoom-focus.sh\" up"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "bash \"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/unzoom-focus.sh\" right"

# ---------------------------------------------------------------------------
# UI: narrower sidebar (default is 26 / min 18 / max 36)
# ---------------------------------------------------------------------------
[ui]
tab_bar_position = "top"
# A plain right-click always opens herdr's own pane menu; Ctrl+right-click is
# passed to the app in the pane instead (e.g. herdr-sidebar's file menu).
right_click_passthrough_modifier = "ctrl"
# Kept visible even with one tab, so the attention count below always shows.
hide_tab_bar_when_single_tab = false
# Right edge of the tab row: agents that need you ("! 1 wait · ✓ 2 done"),
# empty when none do. prefix+o jumps to the latest notification's pane.
tab_bar_right = [
  { type = "command", command = "\"${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/attention_status.sh\"", interval_seconds = 3, timeout_seconds = 2 },
]


# Let split panes share one divider instead of keeping a separating gap
# (herdr's default is true = separated). tmux-style: one line between panes.
# pane_gaps = false
pane_gaps = false
pane_outer_borders = false
sidebar_width     = 22
sidebar_min_width = 14
sidebar_max_width = 40

# Two more knobs if it is still not tight enough — both default true:
  # pane_outer_borders = true   # drop the frame around the whole layout
  # pane_scrollbars    = false   # reclaim the scrollbar column beside each pane

# [ui]
# sidebar_width     = 22
# sidebar_min_width = 14
# sidebar_max_width = 40

# show_agent_labels_on_pane_borders = true

# Sidebar sort order. Only valid values: "spaces" / "workspaces" (grouped by
# workspace) or "priority" (attention queue). Still no "recent"/MRU value as of
# 0.9.x — MRU comes from the leon.mru-spaces plugin instead
# (plugins/local/herdr-mru-spaces): a workspace.focused event hook that moves
# the focused workspace to the top, so "spaces" order IS most-recently-used.
# agent_panel_sort = "priority"

# High-contrast accent for focused pane border, highlights, nav UI (gruvbox orange)
# accent = "#fe8019"

# --- Sidebar row layouts (herdr 0.7.5) ---------------------------------------
# Agents (priority/flat view): line 1 = status icon + workspace, line 2 = what
# the agent is doing (cleaned terminal title). Tells you at a glance which agent
# is where and what it's working on.
status_indicators = "symbols"
[ui.sidebar.agents]
row_gap = 0
rows = [
  [ "state_icon", { token = "workspace", bold = true } ],
  [ { token = "terminal_title_stripped", dim = true } ],
]

# codex usually has no useful task title -> show its status text instead.
# [ui.sidebar.agents.rows_by_agent]
# codex = [
#   [ "state_icon", { token = "workspace", bold = true } ],
#   [ { token = "state_text", dim = true } ],
# ]

# Spaces (grouped view): workspace + git branch/status.
# [ui.sidebar.spaces]
# row_gap = 0
# rows = [
#   [ "state_icon", { token = "workspace", bold = true } ],
#   [ { token = "branch", dim = true }, "git_status" ],
# ]

# [ui.toast]
# delivery = "herdr"

# Native agent resume on server restart (0.8.0+); replaces the DIY resurrect
# in scripts/resurrect/ (disabled via HERDR_NO_RESURRECT in bash/.bashrc).
# Only works for agents whose integration reports a session ref — run
# `herdr integration install claude` (and codex) and keep it current with the
# server version, or agent_session stays null and nothing is resumed.
# Resumes as `<agent> --resume <id>`: no argv is stored, so launch flags such
# as --dangerously-skip-permissions do not survive.
# [session]
# resume_agents_on_restore = true

# [experimental]
# Real graphics protocol for image-rendering TUIs (yazi previews, timg -pkitty)
# instead of half-block characters. Needs the *host* terminal to support it too
# — herdr forwards the graphics, it does not rasterise them itself.
# kitty_graphics = true
# pane_history = true
# switch_ascii_input_source_in_prefix = false

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "terminal"

# The default bottom-right never showed up on screen here; top-right does.
[ui.toast.herdr]
position = "top-right"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
